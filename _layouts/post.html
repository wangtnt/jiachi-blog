---
layout: default
---
<style>
  .post-header { margin-bottom: 30px; }
  .post-title { font-size: 28px; font-weight: bold; color: #1a1a2e; margin-bottom: 10px; }
  .post-meta { color: #666; font-size: 14px; margin-bottom: 20px; }
  .post-meta span { margin-right: 16px; }
  .post-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: #e8f0fe;
    color: #1a73e8;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 13px;
  }
  .post-body { line-height: 1.8; }
  .post-body h1, .post-body h2, .post-body h3 { color: #1a1a2e; margin: 1.5em 0 0.6em; }
  .post-body h1 { font-size: 24px; }
  .post-body h2 { font-size: 20px; }
  .post-body h3 { font-size: 17px; }
  .post-body p { margin-bottom: 16px; }
  .post-body ul, .post-body ol { margin: 16px 0; padding-left: 28px; }
  .post-body li { margin-bottom: 6px; }
  .post-body blockquote {
    border-left: 4px solid #1a73e8;
    background: #e8f0fe;
    padding: 12px 16px;
    margin: 20px 0;
    border-radius: 0 6px 6px 0;
  }
  .post-body pre {
    background: #1e1e2e;
    color: #cdd6f4;
    padding: 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.6;
  }
  .post-body code {
    background: #e9eef6;
    color: #c7254e;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 14px;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
  }
  .post-body pre code {
    background: none;
    color: inherit;
    padding: 0;
  }
  .post-body img { max-width: 100%; height: auto; border-radius: 6px; margin: 16px 0; display: block; }
  .post-body table { border-collapse: collapse; width: 100%; margin: 20px 0; }
  .post-body th { background: #1a73e8; color: #fff; padding: 10px 14px; text-align: left; }
  .post-body td { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; }
  .post-body tr:hover { background: #f5f5f5; }
  .post-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid #e0e0e0;
    gap: 20px;
  }
  .post-nav a {
    flex: 1;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .post-nav a:hover {
    border-color: #1a73e8;
    box-shadow: 0 2px 8px rgba(26,115,232,0.15);
    text-decoration: none;
  }
  .post-nav .prev-nav::before { content: "← "; }
  .post-nav .next-nav { text-align: right; }
  .post-nav .next-nav::before { content: "→ "; }
</style>

<article>
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span>📅 {{ page.date | date: "%Y-%m-%d" }}</span>
    </div>
    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</article>

<div class="post-nav">
  {% if page.previous %}
  <a href="{{ page.previous.url }}" class="prev-nav">上一篇</a>
  {% else %}<span></span>{% endif %}
  {% if page.next %}
  <a href="{{ page.next.url }}" class="next-nav">下一篇</a>
  {% endif %}
</div>
